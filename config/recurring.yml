#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  expire_orphaned_users:
    class: Sync::OrphanedSweeper
    queue: default
    schedule: every hour at minute 37
  activate_pending_start_users:
    class: Users::ActivationSweeper
    queue: default
    schedule: every hour at minute 7
  expire_time_bounded_grants:
    class: Accesses::ExpirySweeper
    queue: default
    schedule: every hour at minute 22
