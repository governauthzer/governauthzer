openapi: "3.0.3"

info:
  title: governauthzer Management API
  version: "1"
  description: |
    Decision-plane IGA — bring your own provisioner.

    This is the management API for governauthzer. It is the only user-management
    surface at v1. Your HRIS or onboarding system calls POST on hire, PATCH for
    attribute updates and status transitions, GET for read/list.

servers:
  - url: http://localhost:3000/api/v1
    description: Development
  - url: /api/v1
    description: Default (relative)

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: API token issued per consumer. Pass as Authorization header.

  schemas:
    Error:
      type: object
      required: [error]
      description: |
        Canonical error envelope. All 4xx and 5xx responses follow this shape.
        Clients should branch on `error.code` (machine-readable, stable) rather
        than on `error.message` (human-readable, may change between versions).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code in snake_case (e.g., "unauthorized", "validation_failed").
            message:
              type: string
              description: Human-readable error message for operator logs and debugging.
            details:
              type: object
              description: Optional structured context specific to the error code.
              additionalProperties: true

    ExternalIdentity:
      type: object
      required: [id, source, external_id]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: Normalized source slug (lowercase, dash-separated).
        external_id:
          type: string

    ExternalIdentityRef:
      type: object
      required: [source, external_id]
      properties:
        source:
          type: string
          description: |
            HRIS source identifier (e.g., "workday", "bamboohr"). Normalized
            server-side: lowercased, non-alphanumerics replaced with dashes,
            repeated dashes squeezed.
        external_id:
          type: string
          description: The user's identifier in the source system.

    OmniauthIdentity:
      type: object
      required: [id, auth_provider_slug, subject]
      properties:
        id:
          type: string
          format: uuid
        auth_provider_slug:
          type: string
        subject:
          type: string
          description: The OIDC `sub` claim value for this user at this provider.

    OmniauthIdentityRef:
      type: object
      required: [auth_provider_slug, subject]
      properties:
        auth_provider_slug:
          type: string
          description: Slug of an existing, enabled auth_provider. Unknown slug → 422 `unknown_auth_provider_slug`.
        subject:
          type: string
          description: The OIDC `sub` claim value for this user at this provider.

    RoleRef:
      type: object
      required: [id, slug, name, application_slug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        application_slug:
          type: string

    Grant:
      type: object
      required: [application, role, user]
      description: |
        An active grant — a user who should hold a role. The bulk twin of the
        outbound access events: same coordinates, minimal fields. `application.slug`
        only namespaces the role (role slugs are unique per application). The
        self/operator application is never included.
      properties:
        application:
          type: object
          required: [slug]
          properties:
            slug:
              type: string
        role:
          type: object
          required: [slug]
          properties:
            slug:
              type: string
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email

    User:
      type: object
      required: [id, email, name, status, created_at, updated_at, external_identities, omniauth_identities, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          description: Single full-name field (no first/last split). HRIS is source of truth.
        status:
          type: string
          enum: [pending_start, active, suspended, terminated, orphaned]
          description: |
            `orphaned` is a system-assigned state: the user lost its last
            external_identity in a snapshot drop and is in the reversible 72h
            grace before termination. Not directly settable via the API.
        manager_id:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        external_identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentity"
        omniauth_identities:
          type: array
          items:
            $ref: "#/components/schemas/OmniauthIdentity"
        roles:
          type: array
          description: Roles currently granted to this user (from approved accesses).
          items:
            $ref: "#/components/schemas/RoleRef"

    ManagerExternalIdRef:
      type: object
      nullable: true
      description: |
        Reference a manager by HRIS external identifier instead of UUID. Server resolves
        to user_id before save. Mutually exclusive with `manager_id` (422 `conflicting_manager_ref`
        if both present). When explicitly `null`, clears the manager assignment (same as
        `manager_id: null`). Unknown reference → 422 `manager_not_found`.
      required: [source, external_id]
      properties:
        source:
          type: string
          description: HRIS source slug (normalized server-side).
        external_id:
          type: string
          description: User's identifier in the source system (e.g., Workday employee_id).

    UserCreate:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [email, name]
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            status:
              type: string
              enum: [pending_start, active, suspended, terminated]
              description: |
                Optional. If omitted, derived from `start_date`: NULL or past → `active`,
                future → `pending_start`. Explicit value wins.
            manager_id:
              type: string
              format: uuid
              nullable: true
            manager_external_id:
              $ref: "#/components/schemas/ManagerExternalIdRef"
            department:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
            start_date:
              type: string
              format: date
              nullable: true
            end_date:
              type: string
              format: date
              nullable: true
            external_identities:
              type: array
              items:
                $ref: "#/components/schemas/ExternalIdentityRef"
            omniauth_identities:
              type: array
              items:
                $ref: "#/components/schemas/OmniauthIdentityRef"

    UserUpdate:
      type: object
      required: [user]
      description: |
        Partial update. Only included fields are changed. Status transitions are
        validated against the state machine; illegal transitions → 422
        `validation_failed`. PATCH on a terminated user → 422 `reactivation_required`
        regardless of attempted changes. Setting `status: terminated` is a terminal,
        exclusive operation: it revokes all of the user's accesses (approved and
        pending) and emits the corresponding audit/webhook events; any other fields in
        the same request are ignored. Identity management uses dedicated endpoints,
        not this PATCH.
      properties:
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            status:
              type: string
              enum: [pending_start, active, suspended, terminated]
            manager_id:
              type: string
              format: uuid
              nullable: true
            manager_external_id:
              $ref: "#/components/schemas/ManagerExternalIdRef"
            department:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
            start_date:
              type: string
              format: date
              nullable: true
            end_date:
              type: string
              format: date
              nullable: true

    SnapshotUser:
      type: object
      required: [external_id, email, name]
      description: Complete desired state of one user within a source. Absence from the array is the drop signal.
      properties:
        external_id:
          type: string
          description: User's identifier in this source. Unique within the source.
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [active, pending_start, suspended]
          description: |
            Optional; derived from start_date if omitted. `terminated` is rejected
            (400 `terminated_in_snapshot`) — termination is expressed by absence.
        department:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        manager_external_id:
          type: string
          nullable: true
          description: Manager's external_id in the same source. Resolved in a second pass; forward references within the snapshot are fine.

    SyncSnapshotCreate:
      type: object
      required: [as_of, expected_count, users]
      properties:
        as_of:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp the agent assigns to this roster. Must not be in the future (5-min skew guard) or older than the last applied snapshot for this source.
        expected_count:
          type: integer
          minimum: 0
          description: Asserted size of `users`. A drift greater than 5% from the actual array size → 400 `count_mismatch` (truncated-feed guard).
        dry_run:
          type: boolean
          default: false
          description: When true, compute and return the diff without applying any writes.
        override_circuit_breaker:
          type: boolean
          default: false
          description: When true, bypass the mass-termination safety threshold. Required when computed orphans exceed 10% of the source's users.
        users:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotUser"

    SyncSnapshotDiff:
      type: object
      required: [users_created, users_updated, users_unchanged, identities_dropped, users_orphaned, users_terminated]
      properties:
        users_created:
          type: integer
        users_updated:
          type: integer
        users_unchanged:
          type: integer
        identities_dropped:
          type: integer
        users_orphaned:
          type: integer
        users_terminated:
          type: integer
          description: Usually 0 — terminations happen later via the grace sweeper, not inline.

    SyncSnapshotResponse:
      type: object
      required: [source, as_of, applied, diff, orphaned, warnings]
      properties:
        source:
          type: string
          description: The source the token is scoped to (echoed back).
        as_of:
          type: string
          format: date-time
        applied:
          type: boolean
          description: false when dry_run was set.
        diff:
          $ref: "#/components/schemas/SyncSnapshotDiff"
        orphaned:
          type: array
          description: Users that lost their last identity in this snapshot and entered the orphan grace.
          items:
            type: object
            required: [id, email]
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
        warnings:
          type: array
          description: Non-fatal issues (e.g., dangling or self-referential manager).
          items:
            type: object
            required: [code]
            additionalProperties: true
            properties:
              code:
                type: string
        snapshot_run_id:
          type: string
          format: uuid
          nullable: true
          description: The persisted snapshot_runs row; null for dry runs.

    ReconciliationCreate:
      type: object
      required: [event_id, status]
      properties:
        event_id:
          type: string
          format: uuid
          description: The CloudEvent `id` (= the audit event id) the provisioner applied.
        status:
          type: string
          enum: [applied, failed]
          description: Whether the provisioner applied the access change to the target system.
        detail:
          type: string
          nullable: true
          description: Optional human-readable context, especially on failure.

    ReconciliationResponse:
      type: object
      required: [event_id, provisioning_status, access_present]
      properties:
        event_id:
          type: string
          format: uuid
        provisioning_status:
          type: string
          enum: [applied, failed]
        access_present:
          type: boolean
          description: |
            false when the event was a revoke (the access row no longer exists);
            the report is still recorded in the audit log.

  responses:
    Unauthorized:
      description: Missing or invalid API token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The token is valid but lacks the scope this endpoint requires.
        `error.code` is `source_scope_required` for the snapshot endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request — missing parameter, invalid sort field, or unpermitted parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: |
        Request body failed validation. Distinguish by `error.code`:
        `validation_failed` (generic), `reactivation_required` (PATCH on terminated user),
        `unknown_auth_provider_slug` (referenced auth_provider does not exist or is disabled),
        `conflicting_manager_ref` (both manager_id and manager_external_id set),
        `manager_not_found` (manager_external_id does not resolve to any user).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Identity collision. `error.code` is `external_id_collision` or
        `omniauth_identity_collision`; `error.details` carries `existing_user_id` plus
        the colliding identity attributes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: HTTP method not supported on this resource. `error.message` explains the rationale and points to the supported alternative.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        Too many requests. `error.code` is `rate_limited`; `error.details.retry_after`
        and the `Retry-After` header give the seconds to wait. Limits are per-IP
        (600/min) and per-token (3000/min) across `/api/v1/*`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
            pattern: "^[0-9]+$"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - BearerToken: []

paths:
  /whoami:
    get:
      summary: Verify API token
      description: |
        Returns information about the API token used to authenticate this request.
        Use this endpoint after configuring a token to verify it is valid and active.
      operationId: whoami
      security:
        - BearerToken: []
      responses:
        "200":
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, token_name]
                properties:
                  token_id:
                    type: string
                    format: uuid
                  token_name:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /grants:
    get:
      summary: List active grants (membership for reconciliation)
      operationId: listGrants
      description: |
        Bulk read of active grants — who should hold which role — for a fulfilment
        bridge to reconcile the target system against. Core is the source of truth;
        a bridge pulls this fresh and never caches it. Accepts a reconcile-scoped
        token (the bridge's token) or a full token. The self/operator application
        is excluded. The unit is the grant; `application.slug` only namespaces the
        role.
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated grant list. Total count in `X-Total-Count` header; pagination links in `Link` header.
          headers:
            X-Total-Count:
              description: Total number of records matching the filter (HTTP header — string-encoded integer).
              schema:
                type: string
                pattern: "^[0-9]+$"
            Link:
              description: |
                Pagination links per RFC 5988. Includes `rel="first"`, `rel="last"`,
                and (when applicable) `rel="prev"` / `rel="next"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /users:
    get:
      summary: List users
      operationId: listUsers
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort
          in: query
          description: |
            Sort fields, comma-separated. Prefix with `-` for descending order.
            Whitelisted fields: `created_at`, `updated_at`, `email`, `name`, `status`.
            Default: `-created_at`. Unknown field → 400 `invalid_sort`.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_start, active, suspended, terminated]
        - name: manager_id
          in: query
          schema:
            type: string
            format: uuid
        - name: department
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated user list. Total count in `X-Total-Count` header; pagination links in `Link` header.
          headers:
            X-Total-Count:
              description: Total number of records matching the filter (HTTP header — string-encoded integer).
              schema:
                type: string
                pattern: "^[0-9]+$"
            Link:
              description: |
                Pagination links per RFC 5988. Includes `rel="first"`, `rel="last"`,
                and (when applicable) `rel="prev"` / `rel="next"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      summary: Create a user
      description: |
        Atomic creation of a user with optional inline external_identities and
        omniauth_identities. All identities are validated and inserted in a single
        transaction with the user row.
      operationId: createUser
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a user
      operationId: getUser
      security:
        - BearerToken: []
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update a user
      operationId: updateUser
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Not supported
      description: |
        Users cannot be deleted via API; IGA audit-trail requirements forbid
        physical deletion. Use PATCH with `status: terminated` instead. GDPR
        right-to-erasure will land as a separate explicit endpoint.
      operationId: deleteUser
      security:
        - BearerToken: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /users/by-external-id/{source}/{external_id}:
    parameters:
      - name: source
        in: path
        required: true
        description: HRIS source slug (normalized server-side — `Workday`, `workday`, `WORKDAY` all resolve to `workday`).
        schema:
          type: string
      - name: external_id
        in: path
        required: true
        description: User's identifier in the source system.
        schema:
          type: string

    patch:
      summary: Update a user by HRIS external identifier
      description: |
        Alternative to `PATCH /users/{id}` for callers that hold an HRIS-side
        identifier rather than the governauthzer UUID. Looks up via `external_identities`
        table (the `(source, external_id)` unique row), then delegates to the same
        update path. Body, semantics, error envelope, and audit emission are identical
        to `PATCH /users/{id}`.
      operationId: updateUserByExternalId
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /sync/snapshots:
    post:
      summary: Apply a full-roster snapshot for one source
      description: |
        Snapshot-and-diff sync. The agent sends the complete active roster for one
        HRIS source; the server diffs it against current state. Users absent from
        `users[]` have their identity for this source dropped, and are orphaned if
        they have no identity from any other source.

        The source is taken from the API token scope — never the body. The token
        must be source-scoped (403 `source_scope_required` otherwise). Atomic: any
        error means nothing is applied.
      operationId: applySnapshot
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncSnapshotCreate"
      responses:
        "200":
          description: |
            Snapshot processed. `applied` is true for a real apply, false for a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSnapshotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /applications/{application_id}/reconciliations:
    post:
      summary: Report provisioning reconciliation for an emitted event
      description: |
        Provisioner → core feedback. After applying (or failing to apply) an
        outbound CloudEvent, the bridge reports back here, echoing the event `id`
        it processed. For a grant the corresponding access's `provisioning_status`
        is set to applied/failed; for a revoke (the access row is gone) the report
        is recorded in the audit log only (`access_present` is false).

        Accepts a reconcile-scoped token (or a full token). A full-scope token is
        required for every other endpoint; a reconcile-scoped token may reach only
        this one (403 `scope_insufficient` elsewhere).
      operationId: reportReconciliation
      security:
        - BearerToken: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
